<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Premium Camera Store — Shop the finest cameras from Canon, Nikon, Sony & Fujifilm. Professional gear for photographers who demand excellence.">
    <title>Premium Camera Store — Capture Every Moment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ═══════════════════ HEADER / HERO ═══════════════════ -->
    <header id="hero" class="hero">
        <div class="hero__overlay"></div>
        <img src="images/hero-banner.png" alt="Premium DSLR camera with dramatic studio lighting" class="hero__image">
        <div class="hero__content">
            <span class="hero__badge">Est. 2024</span>
            <h1 class="hero__title">Premium Camera Store</h1>
            <p class="hero__tagline">Capture Every Moment</p>
            <a href="#products" class="hero__cta">Explore Collection</a>
        </div>
    </header>

    <!-- ═══════════════════ PRODUCTS ═══════════════════ -->
    <main id="products" class="products">
        <div class="products__header">
            <span class="products__label">Our Collection</span>
            <h2 class="products__title">Featured Cameras</h2>
            <p class="products__subtitle">Handpicked professional gear for photographers who demand excellence</p>
        </div>
        <div id="product-grid" class="products__grid">
            <!-- Cards rendered by script.js -->
        </div>
    </main>

    <!-- ═══════════════════ FOOTER ═══════════════════ -->
    <footer id="footer" class="footer">
        <div class="footer__inner">
            <div class="footer__brand">
                <svg class="footer__logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="13" r="3" />
                    <path d="M5 7h2l1.5-2h7L17 7h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z" />
                </svg>
                <span>Premium Camera Store</span>
            </div>
            <p class="footer__contact">contact@premiumcamerastore.com</p>
            <p class="footer__copy">&copy; <span id="footer-year"></span> Premium Camera Store. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
